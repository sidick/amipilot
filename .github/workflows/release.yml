name: Release

# Tag-driven releases: a release PR bumps version.mk + amipilot.readme's
# Version: field through normal review/CI, then pushing the matching
# v<version> tag runs this. verify-version confirms the pushed tag actually
# matches those two files; release then delegates the build -> GitHub
# release -> Aminet-upload-behind-required-review pipeline to
# sidick/amiga-workflows' aminet-release.yml -- same pattern as sana2loop
# and AmiAuth's own release.yml.

on:
  push:
    tags: ['v*']

jobs:
  verify-version:
    name: Verify tag matches version.mk / amipilot.readme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/verify-version.sh "${{ github.ref_name }}"

  release:
    name: Build, release, and (on approval) publish to Aminet
    needs: verify-version
    # A reusable workflow's own `permissions:` can only narrow, never
    # widen, what the calling job already has - aminet-release.yml's
    # `gh release create` step needs contents: write, so it has to be
    # granted here too, not just relied on inside that workflow.
    permissions:
      contents: write
    uses: sidick/amiga-workflows/.github/workflows/aminet-release.yml@v1
    with:
      tag: ${{ github.ref_name }}
      project-name: AmiPilot
      lha-path: build/dist/amipilot.lha
      readme-path: build/dist/amipilot.readme
      category: util/misc

  publish-pypi:
    name: Build and publish host package to PyPI
    needs: verify-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC) -- no stored API token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade build
      - run: python -m build host
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: host/dist
