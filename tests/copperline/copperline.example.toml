# Template for tests/copperline/copperline.local.toml (gitignored -- copy
# this file to that name and fill in your own paths). See README.md in
# this directory and CLAUDE.md's "On-target testing" section for the full
# workflow this config supports.
#
# Points Copperline's hostfs at the same two directories a local
# Amiberry-based dev setup already uses, so nothing needs building or
# copying twice: a Kickstart 3.2 Workbench install (for booting) and this
# repo's own working directory (for freshly built binaries).

rom = "/path/to/your/Kickstarts/A1200.47.115.rom"

# Optional, opt-in: a real Picasso96/RTG board, for
# run_screenshot_p96_check's SCREENSHOT P96-capture-path check (see
# README.md's own "P96/Picasso96 RTG" section for the CPU-profile and
# monitor-driver caveats this needs to actually work, not just skip
# cleanly). Every other check runs fine with this commented out.
# [rtg]
# card = "picasso2"
# vram = "2M"

[[filesys]]
path = "/path/to/your/Workbench-install-directory"
volume = "Workbench"
bootpri = 6

[[filesys]]
path = "/path/to/this/repo/checkout"
volume = "SRC"
bootpri = -128
